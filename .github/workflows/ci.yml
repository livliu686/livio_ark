name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shared: [ON, OFF]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIVIO_ARK_BUILD_SHARED=${{ matrix.shared }}
          -DLIVIO_ARK_BUILD_TESTS=ON
          -DLIVIO_ARK_BUILD_EXAMPLES=ON
          -DLIVIO_ARK_GTEST_BUILD_SHARED=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install smoke
        run: |
          cmake -S . -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIVIO_ARK_ENABLE_INSTALL=ON -DLIVIO_ARK_BUILD_TESTS=OFF -DLIVIO_ARK_BUILD_EXAMPLES=OFF -DLIVIO_ARK_BUILD_SHARED=${{ matrix.shared }}
          cmake --build build-install
          cmake --install build-install --prefix build-install/prefix
          cmake -D LIVIO_INSTALL_PREFIX=build-install/prefix -P scripts/verify_install_package.cmake
