name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shared: [ON, OFF]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIVIO_ARK_BUILD_SHARED=${{ matrix.shared }}
          -DLIVIO_ARK_BUILD_TESTS=ON
          -DLIVIO_ARK_BUILD_EXAMPLES=ON
          -DLIVIO_ARK_GTEST_BUILD_SHARED=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
